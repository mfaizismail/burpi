<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1e4fd8">
<title>BURPI POS</title>
<style>
@font-face{font-family:"Inclusive Sans";font-weight:400;font-display:swap;src:url(fonts/inclusive-sans-400.woff2) format("woff2")}
@font-face{font-family:"Inclusive Sans";font-weight:700;font-display:swap;src:url(fonts/inclusive-sans-700.woff2) format("woff2")}
:root{
  --blue:#1e4fd8; --blue-d:#163aa3; --blue-t:#eef2fd; --blue-l:#c3d1f4;
  --cream:#f8ebd5; --bg:#fdf8ef; --paper:#fffdf9; --white:#ffffff;
  --line:#ecdfc7; --line2:#f3eadb; --ink:#1b1a17; --muted:#5e5547;
  --ok:#1f6b44; --ok-bg:#e3f3ea; --warn:#8a4b05; --warn-bg:#fdeccf; --bad:#a1241a; --bad-bg:#fde4e1;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Inclusive Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
h1{font-size:26px}
h2{font-size:17px}
h3{font-size:15px}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.small{font-size:12px}
.grow{flex:1 1 auto}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:4px}
.right{text-align:right}
.bold{font-weight:700}

/* layout */
.app{display:flex;height:100vh;height:100dvh}
.nav{width:88px;flex:none;background:var(--blue);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 0 18px;gap:6px;overflow-y:auto}
.brand{font-weight:700;color:var(--cream);font-size:18px;letter-spacing:.5px;margin-bottom:12px}
.nav button{position:relative;width:72px;height:62px;border-radius:14px;border:none;background:transparent;color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}
.nav button[aria-current="page"]{background:var(--cream);color:var(--blue)}
.nav .badge{position:absolute;top:6px;right:10px;min-width:18px;height:18px;border-radius:9px;background:#e0a24a;color:#1b1a17;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.main{flex:1 1 auto;min-width:0;overflow-y:auto}
.page{padding:22px;display:flex;flex-direction:column;gap:16px;max-width:1400px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* controls */
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-size:14px}
.btn-sm{height:36px;padding:0 12px;border-radius:10px;font-size:13px}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue-d)}
.btn-outline{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn-ghost{background:var(--paper);border-color:#d9cbb0;color:var(--ink)}
.btn-dashed{background:var(--paper);border:1px dashed var(--blue);color:var(--blue)}
.btn-danger{background:#fff;color:var(--bad);border-color:#e8b4ae}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid #d9cbb0;background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.pill{height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--blue-l);background:#fff;color:var(--blue);font-size:14px}
.pill[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--blue-l);background:#fff;color:var(--blue);font-size:12px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.input,select.input,textarea.input{height:44px;border:1px solid #e3d6bd;border-radius:12px;padding:0 12px;background:var(--paper);width:100%;min-width:0}
textarea.input{height:auto;padding:10px 12px;min-height:70px}
.input-sm{height:36px;border-radius:9px;padding:0 8px;font-size:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{height:44px;padding:0 14px;border:none;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--blue);color:var(--blue);font-weight:700}
.seg{display:inline-flex;gap:4px;background:#f6eedf;padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{height:38px;padding:0 12px;border:none;border-radius:9px;background:transparent;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.card-cream{background:var(--cream);border-radius:18px;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font-size:21px;font-weight:700}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-neutral{background:#f6eedf;color:var(--muted)}
.alert{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:400;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--blue-t)}
.tbl-wrap{overflow-x:auto}

/* kasir */
.kasir{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.kasir .left{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:132px}
.mcard .name{font-size:16px;font-weight:700}
.mcard .btns{margin-top:auto;display:flex;gap:8px}
.mcard .btns .btn{flex:1;min-width:0;height:46px;padding:0 6px;font-size:13px;white-space:normal;line-height:1.15;text-align:center}
.cart{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100%}
.cart-head{padding:18px 18px 12px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.cart-items{flex:1 1 auto;overflow-y:auto;padding:4px 18px}
.cart-foot{padding:14px 18px 18px;border-top:1px solid var(--line2);background:var(--paper);display:flex;flex-direction:column;gap:7px}
.citem{padding:11px 0;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid #d9cbb0;background:var(--paper);font-size:18px}
.qty span{min-width:24px;text-align:center}
.member-box{background:var(--cream);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.stampbar{display:flex;gap:4px}
.stampbar span{flex:1;height:8px;border-radius:4px;background:#e6dcc8}
.stampbar span.on{background:var(--blue)}
.stampbar span.next{background:#9db3ef}
.pay-btn{height:56px;border-radius:14px;font-size:17px;font-weight:700}
.profit{display:flex;justify-content:space-between;font-size:12px;color:var(--ok);background:var(--ok-bg);padding:8px 10px;border-radius:10px}
.cart-fab{display:none}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(27,26,23,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:960px}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:center;background:var(--paper);flex-wrap:wrap}
.block{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.line-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) 44px minmax(0,1fr) 40px;gap:6px;align-items:center}
.receipt{font-size:14px;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px dashed #d9cbb0;border-radius:14px;padding:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1a17;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.bar{height:14px;background:#f6eedf;border-radius:7px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:7px}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}

@media (max-width:1100px){
  .g6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kasir{grid-template-columns:minmax(0,1fr) 340px}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .nav{order:2;width:100%;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow:visible}
  .nav .brand{display:none}
  .nav button{width:auto;flex:1;height:54px;font-size:10px}
  .main{order:1}
  .page{padding:16px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .kasir{display:block;height:auto}
  .kasir .left{padding:16px;padding-bottom:90px;overflow:visible}
  .cart{display:none;position:fixed;inset:0;z-index:40;border:none}
  .cart.open{display:flex}
  .cart-fab{display:flex;position:fixed;left:12px;right:12px;bottom:76px;z-index:30;height:56px;border-radius:14px;justify-content:space-between;padding:0 18px;font-weight:700}
  .line-row{grid-template-columns:minmax(0,1fr) 80px 36px 40px}
  .line-row .lc{display:none}
}
@media print{
  .nav,.no-print,.cart-fab,.toast{display:none!important}
  body,.main{background:#fff;overflow:visible;height:auto}
  .app{height:auto;display:block}
  .card,.kpi{break-inside:avoid}
  body.print-receipt .app{display:none}
  body.print-receipt .overlay{position:static;background:none;padding:0}
  body.print-receipt .modal{max-height:none;box-shadow:none}
  body.print-receipt .modal-head,body.print-receipt .modal-foot{display:none}
}
</style>

/* ------------------------------ costing -------------------------------- */

  } else {

    (v.recipe || []).forEach(function (r) { add(r.ing, +r.qty || 0); });
    (modIds || []).forEach(function (mid) {
      var md = (m.mods || []).filter(function (x) { return x.id === mid; })[0];
      if (md && md.delta && md.delta[v.key]) md.delta[v.key].forEach(function (r) { add(r.ing, +r.qty || 0); });
    });
  }

  return map;
}
function hppOfMap(map) { var s = 0; for (var k in map) s += map[k] * unitCost(k); return s * (1 + (+S.settings.waste || 0)); }

}

/* ------------------------------ stock ---------------------------------- */
function batchesOf(id) { return S.batches.filter(function (b) { return b.ing === id && b.remaining > 0.0001; }).sort(function (a, b) { return new Date(a.expiresAt) - new Date(b.expiresAt); }); }
function stockOf(id) { var i = ing(id); if (!i) return 0; if (i.type === 'prep') return batchesOf(id).reduce(function (s, b) { return s + b.remaining; }, 0) - (i.deficit || 0); return +i.stock || 0; }

function periodRange() {

    case 'month': a = new Date(now.getFullYear(), now.getMonth(), 1); b = new Date(now.getFullYear(), now.getMonth() + 1, 1); label = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); break;
    case 'custom':
      a = ui.from ? sod(new Date(ui.from + 'T00:00:00')) : sod(now);
      b = ui.to ? addDays(sod(new Date(ui.to + 'T00:00:00')), 1) : addDays(sod(now), 1);
      if (b <= a) b = addDays(a, 1);

    case 'pick-qris': document.getElementById('file-qris').click(); break;
    case 'del-qris': S.settings.qris = ''; DB.save(); render(); break;
    case 'export-db': exportDatabase().catch(function (e) { toast('Ekspor gagal: ' + (e.message || e), true); }); break;
    case 'restore': document.getElementById('file-restore').click(); break;
    case 'reset-demo':
      confirmBox('Reset ke data contoh?', 'Semua data di perangkat ini (menu, stok, member, transaksi) diganti dengan data contoh. Unduh cadangan dulu kalau perlu.', 'Reset', function () { S = seed(); genDemo(); resetUi(); DB.replaceAll().then(function () { render(); toast('Data contoh dimuat ulang.'); }); }, true); break;
    case 'clear-data':
      confirmBox('Mulai jualan sungguhan?', 'Transaksi, member, dan riwayat stok contoh dihapus. Menu, resep, harga bahan, dan pengaturan tetap. Setelah ini, isi stok sebenarnya lewat Stok → Edit (stok opname) dan catat batch yang ada.', 'Hapus data contoh', function () {
        S.transactions = []; S.members = []; S.logs = []; S.counter = 0; S.batches = [];
        S.ingredients.forEach(function (x) { if (x.type === 'prep') x.deficit = 0; else x.stock = 0; });
        resetUi(); DB.replaceAll().then(function () { render(); toast('Siap dipakai. Jangan lupa isi stok awal.'); });
      }, true); break;
  }
}
function resetUi() { ui.cart = []; ui.member = null; ui.reg = null; ui.modal = null; ui.draft = null; ui.rewards = { r5: false, r10: false }; }
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('Daftar disalin.'); }, function () { fallbackCopy(txt); });
  else fallbackCopy(txt);
}
function fallbackCopy(txt) { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Daftar disalin.'); } catch (e) { toast('Tidak bisa menyalin otomatis.', true); } ta.remove(); }
function saveMenuDraft() {
  var d = ui.draft;
  if (!String(d.name || '').trim()) { toast('Isi nama menu.', true); return; }
  if (!String(d.cat || '').trim()) { toast('Isi kategori.', true); return; }
  if (d.type === 'bundle') {
    if (!d.components.length) { toast('Paket harus punya isi.', true); return; }
    if (!(d.price > 0)) { toast('Isi harga paket.', true); return; }
  } else {
    for (var i = 0; i < d.variants.length; i++) {
      var v = d.variants[i];
      if (!(v.price > 0)) { toast('Isi harga jual untuk ' + (v.label || 'ukuran ' + (i + 1)) + '.', true); return; }
      v.recipe = v.recipe.filter(function (r) { return r.ing && +r.qty; });
    }
    (d.mods || []).forEach(function (md) { for (var k in md.delta) md.delta[k] = md.delta[k].filter(function (r) { return r.ing && +r.qty; }); });
  }
  d.name = d.name.trim(); d.cat = d.cat.trim();
  var isNew = d._new; delete d._new;
  if (isNew) S.menu.push(d); else S.menu = S.menu.map(function (m) { return m.id === d.id ? d : m; });
  DB.save(); ui.modal = null; ui.draft = null; render(); toast('Menu disimpan.');
}
function saveIngDraft() {
  var d = ui.draft;
  if (!String(d.name || '').trim()) { toast('Isi nama bahan.', true); return; }
  d.name = d.name.trim();
  if (d.type === 'prep') {
    d.inputs = (d.inputs || []).filter(function (r) { return r.ing && +r.qty; });
    if (!(d.yieldQty > 0)) { toast('Isi hasil per batch.', true); return; }
    if (!d.inputs.length && !(d.manualPrice > 0)) { toast('Isi bahan batch atau harga manual.', true); return; }
  }
  var isNew = d._new, orig = d._origStock; delete d._new; delete d._origStock;
  if (d.type !== 'prep' && !isNew && Math.abs((+d.stock || 0) - (+orig || 0)) > 0.0001) {
    S.logs.push({ id: uid('l'), type: 'adjust', at: new Date().toISOString(), ing: d.id, qty: (+d.stock || 0) - (+orig || 0), cost: 0, note: 'Stok opname: ' + nf(orig, 0) + ' → ' + nf(d.stock, 0) });
  }
  if (isNew) S.ingredients.push(d); else S.ingredients = S.ingredients.map(function (x) { return x.id === d.id ? d : x; });
  DB.save(); ui.modal = null; ui.draft = null; render(); toast('Bahan disimpan.');
}
function saveBatch() {
  var f = ui.modal.form, p = ing(f.ing);
  if (!(f.qty > 0)) { toast('Isi jumlah hasil batch.', true); return; }
  var factor = f.qty / p.yieldQty, used = (p.inputs || []).map(function (x) { return { ing: x.ing, qty: x.qty * factor }; });
  used.forEach(function (x) { deduct(x.ing, x.qty); });
  var qty = f.qty, take = Math.min(p.deficit || 0, qty); p.deficit = (p.deficit || 0) - take;
  var exp = f.exp ? new Date(f.exp + 'T23:59:00') : addDays(new Date(), p.shelfDays || 1);
  S.batches.push({ id: uid('b'), ing: p.id, qty: qty, remaining: qty - take, madeAt: new Date().toISOString(), expiresAt: exp.toISOString() });
  S.logs.push({ id: uid('l'), type: 'batch', at: new Date().toISOString(), ing: p.id, qty: qty, cost: Math.round(unitCost(p.id) * qty), inputs: used, note: used.map(function (x) { var i = ing(x.ing); return (i ? i.name : x.ing) + ' −' + nf(x.qty, 0); }).join(', ') });
  S.batches = S.batches.filter(function (b) { return b.remaining > 0.0001 || daysBetween(b.expiresAt, new Date()) < 30; });
  DB.save(); ui.modal = null; render(); toast('Batch ' + p.name + ' dicatat.');
}

/* ------------------------------- events -------------------------------- */
document.addEventListener('click', function (e) {
  var ext = e.target.closest('a[target="_blank"]');
  if (ext) { e.preventDefault(); var href = ext.getAttribute('href'); if (href && href !== '#') Native.openExternal(href); return; }
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'overlay') { if (e.target === el && ui.modal && ['pay', 'receipt', 'welcome'].indexOf(ui.modal.type) >= 0) act('close', {}, el); return; }
  if (el.tagName === 'A') e.preventDefault();
  if (el.disabled) return;
  act(el.dataset.act, el.dataset, el);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.bind !== undefined && ui.draft) {
    if (t.tagName === 'SELECT' || t.type === 'checkbox') return; /* ditangani di event change */
    setPath(ui.draft, t.dataset.bind, readVal(t));
    refreshCalc(); return;
  }
  if (t.dataset.mf !== undefined && ui.modal && ui.modal.form) {
    ui.modal.form[t.dataset.mf] = t.dataset.num !== undefined ? parseNum(t.value) : t.value;
    if (ui.modal.type === 'buy') { var i = ing(ui.modal.form.ing), f = ui.modal.form, el = modalRoot.querySelector('[data-calc="buyinfo"]'); if (el) el.innerHTML = buyInfo(i, f.qty > 0 ? f.total / f.qty : 0); }
    if (ui.modal.type === 'batch') { var p = ing(ui.modal.form.ing), c = modalRoot.querySelector('[data-calc="batchcost"]'); if (c) c.textContent = rp(unitCost(p.id) * (ui.modal.form.qty || 0)); var bi = modalRoot.querySelector('[data-calc="batchinputs"]'); if (bi) { var factor = p.yieldQty > 0 ? (ui.modal.form.qty || 0) / p.yieldQty : 0; bi.innerHTML = (p.inputs || []).map(function (x) { var ii = ing(x.ing); return '<div class="row between small"><span>' + esc(ii ? ii.name : x.ing) + '</span><span>' + nf(x.qty * factor, 0) + ' ' + esc(ii ? ii.unit : '') + ' <span class="muted">(stok ' + nf(stockOf(x.ing), 0) + ')</span></span></div>'; }).join(''); } }
    return;
  }
  var k = t.dataset.in; if (!k) return;
  switch (k) {
    case 'menuQ': ui.menuQ = t.value; render(); break;
    case 'memberQ': ui.memberQ = t.value; render(); break;
    case 'wa': ui.wa = t.value; break;
    case 'reg-name': ui.reg.name = t.value; break;
    case 'reg-ref': ui.reg.ref = t.value; break;
    case 'reg-consent': ui.reg.consent = t.checked; break;
    case 'target': ui.target = parseNum(t.value) || 40; refreshCalc(); break;
    case 'rc-wa':
      ui.modal.phone = t.value; var tx = S.transactions.filter(function (x) { return x.id === ui.modal.tx; })[0], a = document.getElementById('wa-receipt');
      if (a && tx) { var ok = normPhone(t.value).length >= 9; a.href = ok ? 'https://wa.me/' + waNum(t.value) + '?text=' + encodeURIComponent(receiptText(tx)) : '#'; a.style.opacity = ok ? '' : '.45'; a.style.pointerEvents = ok ? '' : 'none'; a.setAttribute('aria-disabled', ok ? 'false' : 'true'); }
      break;
    case 'cash':
      ui.modal.cash = parseNum(t.value); var tt = cartCalc(), ch = modalRoot.querySelector('[data-calc="change"]'), btn = document.getElementById('btn-complete');
      if (ch) ch.textContent = ui.modal.cash >= tt.total ? rp(ui.modal.cash - tt.total) : '—';
      if (btn) btn.disabled = ui.modal.cash < tt.total; break;
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.bind !== undefined && ui.draft && (t.tagName === 'SELECT' || t.type === 'checkbox')) {
    setPath(ui.draft, t.dataset.bind, readVal(t));
    if (ui.draft.type === 'bundle' && /^components\.\d+\.menu$/.test(t.dataset.bind)) { var idx = +t.dataset.bind.split('.')[1], cm = menuById(t.value); if (cm) ui.draft.components[idx].variant = cm.variants[0].key; }
    renderModal(); refreshCalc(); return;
  }
  if (t.dataset.mf === 'ing' && ui.modal && ui.modal.type === 'buy') { var bi = ing(t.value); ui.modal.form.ing = t.value; ui.modal.form.supplier = bi.supplier || ui.modal.form.supplier; renderModal(); return; }
  if (t.dataset.set) {
    var key = t.dataset.set, v;
    if (t.dataset.bool !== undefined) v = t.checked;
    else if (t.dataset.pct !== undefined) v = parseNum(t.value) / 100;
    else if (t.dataset.num !== undefined) v = parseNum(t.value);
    else v = t.value;
    S.settings[key] = v; DB.save(); toast('Tersimpan.'); if (key === 'storeName') render(); return;
  }
  if (t.dataset.cost) { var c = S.settings.fixedCosts[+t.dataset.i]; if (c) { c[t.dataset.cost] = t.dataset.cost === 'amount' ? parseNum(t.value) : t.value; DB.save(); toast('Tersimpan.'); } return; }
  if (t.dataset.rp) { ui[t.dataset.rp] = t.value; render(); return; }
  if (t.dataset.in === 'reg-consent' && ui.reg) { ui.reg.consent = t.checked; return; }
  if (t.id === 'file-restore' && t.files[0]) {
    var file = t.files[0]; t.value = '';
    importFile(file).catch(function (err) { toast('File tidak bisa dibaca: ' + (err.message || err), true); });
    return;
  }
  if (t.id === 'file-qris' && t.files[0]) {
    var qf = t.files[0];
    if (qf.size > 1500000) { toast('Gambar terlalu besar (maks. 1,5 MB). Coba screenshot QRIS-nya.', true); t.value = ''; return; }
    var r2 = new FileReader(); r2.onload = function () { S.settings.qris = r2.result; if (DB.save()) { render(); toast('Gambar QRIS disimpan.'); } }; r2.readAsDataURL(qf); t.value = ''; return;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && ui.modal && ui.modal.type !== 'confirm') { act('close', {}); }
  if (e.key === 'Enter' && e.target && e.target.id === 'wa-in') { e.preventDefault(); act('lookup', {}); }
  if (e.key === 'Enter' && e.target && e.target.id === 'cash-in') { e.preventDefault(); var b = document.getElementById('btn-complete'); if (b && !b.disabled) act('complete', {}); }
});

window.BURPI = { get state() { return S; }, DB: DB, fromTables: fromTables, toTables: toTables };
app.innerHTML = '<div class="empty" style="padding-top:35vh">Memuat data…</div>';
DB.init().then(function () {
  render();
  if (firstRun) { ui.modal = { type: 'welcome' }; renderModal(); }
}).catch(function (e) {
  console.error(e);
  app.innerHTML = '<div class="page"><h1>Database tidak bisa dibuka</h1><div class="muted">' + esc(e && e.message || e) + '</div></div>';
});
Native.onBack(function () {
  if (ui.modal) { if (ui.modal.type === 'confirm') { ui.modal = ui.modal.back || null; renderModal(); } else act('close', {}); return; }
  if (ui.showCart) { ui.showCart = false; render(); return; }
  if (ui.page !== 'kasir') { ui.page = 'kasir'; render(); return; }
  Native.minimize();
});
})();
</script>
